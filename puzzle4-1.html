<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Flip-O 4-1</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
     <link rel="stylesheet" href="desktop.css">
    <link rel="stylesheet" href="shapes.css">
   <style>
    /* Mixed variant (game_mixed.js). Load AFTER style.css and shapes.css. */

/* Step 2 changes colours: let the colour fade instead of snapping, and give the tile a small pop */
.grid.mixed .tile:not(.outer) .tile-face {
    transition: color 250ms ease;
}

.grid.mixed .tile.recolor .shape-svg {
    animation: recolor-pop 260ms ease-out;
}

@keyframes recolor-pop {
    0%   { transform: scale(0.7); }
    60%  { transform: scale(1.12); }
    100% { transform: scale(1); }
}

/* Step 2 is shown by an amber outer ring (same amber as the path and the stars) */
.grid.mixed.phase-2 .tile.outer .tile-face {
    border-color: rgba(255, 179, 0, 0.85);
}

@media (prefers-reduced-motion: reduce) {
    .grid.mixed .tile.recolor .shape-svg { animation: none; }
}
   </style>
</head>

<body>
    <div class="menu-container">
        <header >
            <a href="index.html" class="btn-back">
        <span class="material-symbols-outlined">arrow_back</span>
    </a>
            <h3>Flip-O lv. 4-1</h3>
            
        </header>
        <p data-i18n="puzzle">Select a puzzle to play</p>
     <div id="level-selector" class="level-selector"></div>
    <main class="game">
       
        <div id="grid" class="grid"></div>
        
    </main>
     <div id="modal" class="modal">
            <h1 id="modal-text"></h1>
            <p id="modal-stats"></p>
            <button id="modal-reset-btn" class="btn btn-primary" data-i18n="victory">Try Making<br> Less Moves</button>
            <button id="modal-close-btn" class="btn btn-primary" data-i18n="goback">Go Back</button>
        </div>
    <!-- game_mixed.js writes the current step into this line -->
    <p data-i18n="mixed">Step 1: Make Every Column Same Shape<br>Step 2: Make Every Row One Color</p>
    
</div>
<script>
    // Letters: H = dark heart, h = light heart, S = dark star, s = light star.
    // Step 1 swaps shapes (goal: every column one shape). Step 2 swaps colours (goal: every row one colour).
    const levels = [
        // Level 1: sample, 3x3
        {
            layout: [
                "hss",
                "Sss",
                "SHs"
            ]
        },
        // Level 2: sample, 3x3
        {
            layout: [
                "Shh",
                "hSH",
                "HsH"
            ]
        },
        // Level 3: sample, 4x4
        {
            layout: [
                "ShSH",
                "shhH",
                "SSSH",
                "hssh"
            ]
        },
        // Level 4: sample, 4x4
        {
            layout: [
                "Sssh",
                "sSsS",
                "ssHS",
                "HHss"
            ]
        },
        // Level 5: sample, 4 rows x 5 columns
        {
            layout: [
                "SSHhh",
                "SSSss",
                "Sssss",
                "sssSH"
            ]
        },
        // Level 6: sample, 5x5
        {
            layout: [
                "shhhh",
                "shhSH",
                "HHShs",
                "hhhSH",
                "ShHHs"
            ]
        },
    ];
</script>
    <script src="progress.js"></script>
    
    <script src="game_mixed.js"></script>
<script src="script.js"></script>
</body>
</html>
