<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Tile Flipping Puzzle Game">
  <meta name="keywords" content="Juegos, Educativo, Memorama, Rompecabezas, Puzzle, Games, Flip Grid, Flip Grid Game">
  <meta name="author" content="Guillermo Rayas Monroy">
    <title>Flip-O Main Menu</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="welcomeScreen" class="welcome-screen">

  <div class="welcome-content" >

    <img src="gallery.jpg" id="enterBtn"  alt="Gallery Entrance">

  </div>
  </div>
    <div class="menu-container">
        
        <header class="header">
            <h1>Flip-O</h1>
            <p>Flip the tiles, solve the board.</p>
        </header>

        <!-- Main Action -->
        <a href="puzzle0.html" class="btn btn-primary">
            <span class="material-symbols-outlined">school</span>
            Play Tutorial
        </a>

        <!-- Level Selection -->
        <section class="level-section">
            <h2>Select Level</h2>
            <div class="level-grid">
                
                <!-- Completed Level -->
                <button class="btn btn-level" onclick="window.location.href='index.html'">
                    1
                    <div class="stars">
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">star</span>
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">star</span>
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">star</span>
                    </div>
                </button>

                <!-- Unlocked Level -->
                <button class="btn btn-level" onclick="window.location.href='index.html'">
                    2
                    <div class="stars">
                        <span class="material-symbols-outlined">star</span>
                        <span class="material-symbols-outlined">star</span>
                        <span class="material-symbols-outlined">star</span>
                    </div>
                </button>

                <!-- Locked Levels -->
                <button class="btn btn-level locked" disabled>
                    <span class="material-symbols-outlined">lock</span>
                </button>
                <button class="btn btn-level locked" disabled>
                    <span class="material-symbols-outlined">lock</span>
                </button>
                <button class="btn btn-level locked" disabled>
                    <span class="material-symbols-outlined">lock</span>
                </button>
                <button class="btn btn-level locked" disabled>
                    <span class="material-symbols-outlined">lock</span>
                </button>

            </div>
        </section>

        <!-- Secondary Actions -->
        <div class="secondary-actions">
            <button class="btn btn-icon">
                <span class="material-symbols-outlined">emoji_events</span>
                Stats
            </button>
            <button class="btn btn-icon">
                <span class="material-symbols-outlined">settings</span>
                Settings
            </button>
        </div>
        <p>v. 1.0 | G R Monroy 2026 </p>
    </div>

<script src="script.js" type="text/javascript"></script>

</body>
</html>
