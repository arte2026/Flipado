                    </div>
                </button>

                        <span class="material-symbols-outlined">star</span>
                        <span class="material-symbols-outlined">star</span>
                    </div>

<defs><rect id="c14" width="14" height="14" rx="3"/><rect id="c22" width="22" height="22" rx="5"/><rect id="c18" width="18" height="18" rx="4"/></defs>

<text x="180" y="46" text-anchor="middle" font-family="Offside,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#6750A4">How to play</text>

<circle cx="38" cy="96" r="12" fill="#6750A4"/>
<text x="38" y="101" text-anchor="middle" font-family="Offside,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
<text x="58" y="101" font-family="Offside,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1D1B20">Swipe a path</text>
<text x="24" y="128" font-family="Offside,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#49454F">Drag across touching tiles.</text>
<text x="24" y="145" font-family="Offside,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#49454F">A path can't cross itself.</text>
<rect x="238" y="78" width="96" height="90" rx="12" fill="#E8DEF8"/>
<rect x="16" y="188" width="328" height="106" rx="16" fill="#F3EDF7"/>
<circle cx="38" cy="214" r="12" fill="#6750A4"/>
<text x="38" y="219" text-anchor="middle" font-family="Offside,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
<text x="58" y="219" font-family="Offside,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1D1B20">Tiles flip</text>
<text x="24" y="246" font-family="Offside,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#49454F">Every board tile you touch</text>
<text x="24" y="263" font-family="Offside,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#49454F">switches color.</text>
<rect x="238" y="196" width="96" height="90" rx="12" fill="#E8DEF8"/>
<rect x="16" y="306" width="328" height="106" rx="16" fill="#F3EDF7"/>
<circle cx="38" cy="332" r="12" fill="#6750A4"/>
<text x="38" y="337" text-anchor="middle" font-family="Offside,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
<text x="58" y="337" font-family="Offside,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1D1B20">The ring is free</text>
<text x="24" y="364" font-family="Offside,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#49454F">Dotted tiles around the</text>
<text x="24" y="381" font-family="Offside,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#49454F">board never flip. Use them</text>
<text x="24" y="398" font-family="Offside,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#49454F">to travel.</text>
<rect x="238" y="314" width="96" height="90" rx="12" fill="#E8DEF8"/>
<rect x="16" y="424" width="328" height="106" rx="16" fill="#F3EDF7"/>
<circle cx="38" cy="450" r="12" fill="#6750A4"/>
<text x="38" y="455" text-anchor="middle" font-family="Offside,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
<text x="58" y="455" font-family="Offside,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1D1B20">Make columns match</text>
<text x="24" y="482" font-family="Offside,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#49454F">You win when every column</text>
<text x="24" y="499" font-family="Offside,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#49454F">is a single color, black</text>
<text x="24" y="516" font-family="Offside,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#49454F">or white.</text>
