            <h3>Flip-O 3-2</h3>

        <p>Select a puzzle to play</p>

    <div id="modal" class="modal">

            <button id="modal-close-btn" class="btn btn-primary">Close</button>
        </div>
    <p>Make Every ROW the Same SHAPE</p>
    
</div>
<script>
    // Letters: H = dark heart, h = light heart, S = dark star, s = light star.
    // Flipping a tile swaps heart and star. Goal: each row is all hearts or all stars.
    const levels = [
        // Level 1: Sample 1: 3x3
        {
            layout:[
    "ssHHH",
    "sssHH",
    "HHsHH",
    "HHsss",
    "HHHHs"
],
        },

    "HssHH",

    "HHssH",
